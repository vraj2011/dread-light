<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DREADLIGHT</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    #np-root {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 32px;
      animation: npIn 0.85s ease forwards;
    }
    @keyframes npIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .np-inner {
      display: flex;
      align-items: center;
      gap: 48px;
      width: 100%;
      max-width: 860px;
    }

    .np-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
    }
    .np-portrait-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 16px;
    }
    .np-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid;
      animation: ringPulse 3s ease-in-out infinite;
    }
    .np-ring:nth-child(1) { inset: -8px;  opacity: 0.4; }
    .np-ring:nth-child(2) { inset: -18px; opacity: 0.18; animation-delay: 0.5s; }
    @keyframes ringPulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    .np-portrait {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid;
    }
    .np-ghost-name {
      font-family: 'Creepster', cursive;
      font-size: clamp(22px, 3.5vw, 40px);
      letter-spacing: 5px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 3px 3px 0 #050000;
    }
    .np-lore {
      font-family: 'Special Elite', serif;
      font-size: 10px;
      color: #5a4040;
      letter-spacing: 2.5px;
      text-align: center;
      line-height: 1.9;
      max-width: 220px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .np-right {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .np-eyebrow {
      font-family: 'Special Elite', serif;
      font-size: 8px;
      letter-spacing: 7px;
      color: #3a2020;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .np-night-label {
      font-family: 'Creepster', cursive;
      font-size: clamp(36px, 6vw, 80px);
      line-height: 0.9;
      letter-spacing: 3px;
      margin-bottom: 20px;
      animation: flicker 7s ease-in-out infinite;
    }
    .np-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .np-divider span {
      font-family: 'VT323', monospace;
      font-size: 12px;
      color: #3a2020;
      letter-spacing: 4px;
      white-space: nowrap;
    }
    .np-divider::before, .np-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #3a1a1a, transparent);
    }
    .np-levels {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .np-tile {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      font-size: 24px;
      color: #cc6060;
      border: 1px solid rgba(160, 50, 50, .6);
      background: rgba(40, 8, 8, 0.7);
      cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
      position: relative;
      box-sizing: border-box;
    }
    .np-tile:hover {
      background: rgba(120, 20, 20, .55);
      color: #ff7070;
      border-color: rgba(200, 60, 60, .8);
    }
    .np-tile.locked {
      color: #4a2828;
      border-color: rgba(60, 20, 20, .3);
      background: rgba(15, 4, 4, 0.55);
      cursor: not-allowed;
    }
    .np-tile.done::after {
      content: '✓';
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 11px;
      color: #407840;
    }
    .np-back {
      font-family: 'VT323', monospace;
      font-size: 17px;
      letter-spacing: 3px;
      color: #3a2020;
      background: none;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      padding: 0;
      transition: color 0.15s;
      text-align: left;
    }
    .np-back:hover { color: #884444; }


    @media (max-width: 580px) {
      .np-inner   { flex-direction: column; gap: 20px; }
      .np-left    { flex-direction: row; gap: 16px; align-items: flex-start; }
      .np-portrait-wrap { width: 90px; height: 90px; flex-shrink: 0; }
      .np-night-label { font-size: 38px; }
      .np-levels  { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="blood-strip"></div>
  <div id="scene"></div>
  <div id="vignette"></div>

  <div id="np-root">
    <div class="np-inner">


      <div class="np-left">
        <div class="np-portrait-wrap">
          <div class="np-ring" id="npRing1"></div>
          <div class="np-ring" id="npRing2"></div>
          <img class="np-portrait" id="npPortrait" src="" alt="">
        </div>
        <div class="np-ghost-name" id="npGhostName"></div>
        <div class="np-lore"       id="npLore"></div>
      </div>


      <div class="np-right">
        <div class="np-eyebrow">dreadlight</div>
        <div class="np-night-label" id="npNightLabel"></div>
        <div class="np-divider"><span>enter if you dare</span></div>
        <div class="np-levels" id="npLevels"></div>
        <button class="np-back" id="npBack">← back to menu</button>
      </div>

    </div>
  </div>

  <script>
    // blood drip
    (function() {
      const strip = document.getElementById('blood-strip');
      if (!strip) return;
      const n = Math.floor(window.innerWidth / 16) + 2;
      for (let i = 0; i < n; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'drip';
        const bh = 1 + Math.random() * 18;
        const tw = 3 + Math.random() * 9;
        const th = 6 + Math.random() * 16;
        const op = (0.35 + Math.random() * 0.55).toFixed(2);
        wrap.innerHTML =
          `<div class="drip-body" style="height:${bh.toFixed(1)}px;opacity:${op}"></div>` +
          (Math.random() > 0.4 ? `<div class="drip-tip" style="width:${tw.toFixed(1)}px;height:${th.toFixed(1)}px;opacity:${op}"></div>` : '');
        strip.appendChild(wrap);
      }
    })();

    const NIGHTS_DATA = [
      { label:'NIGHT ONE',       ghost:'THE CRAWLER',   img:'images/ghost_level_1.jpg', lore:'It moves on all fours. It never stands. Drawn to sound.',                              col:'#999999', glow:'rgba(150,150,150,0.7)', glowDim:'rgba(150,150,150,0.2)', filter:'contrast(2.2) brightness(0.45) saturate(0)' },
      { label:'NIGHT TWO',       ghost:'SHADOW WRAITH', img:'images/ghost_level_2.jpg', lore:"Won't see it until it's too late. Lives in the space between blinks.",                 col:'#aaaaaa', glow:'rgba(100,100,100,0.6)', glowDim:'rgba(80,80,80,0.15)',   filter:'contrast(2.4) brightness(0.22) saturate(0) grayscale(1)' },
      { label:'NIGHT THREE',     ghost:'THE BANSHEE',   img:'images/ghost_level_3.jpg', lore:"Her scream travels faster than light. By the time you hear it — she's behind you.",   col:'#44bb44', glow:'rgba(20,180,20,0.6)',  glowDim:'rgba(20,180,20,0.15)',  filter:'contrast(1.8) brightness(0.5) saturate(1.4) hue-rotate(90deg)' },
      { label:'NIGHT FOUR',      ghost:'THE PENITENT',  img:'images/ghost_level_4.jpg', lore:'It prays for you. It is coming to collect your sins.',                                 col:'#ccaa44', glow:'rgba(200,170,80,0.6)', glowDim:'rgba(200,170,80,0.15)', filter:'contrast(1.6) brightness(0.55) saturate(0.8) sepia(0.5)' },
      { label:'NIGHT FIVE',      ghost:'THE DOLL',      img:'images/ghost_level_5.jpg', lore:"She just wants a friend. She doesn't understand why everyone runs.",                   col:'#cc3030', glow:'rgba(200,50,50,0.7)',  glowDim:'rgba(200,50,50,0.15)',  filter:'contrast(2.0) brightness(0.45) saturate(0.3) hue-rotate(340deg)' },
      { label:'NIGHT SIX',       ghost:'THE JESTER',    img:'images/ghost_level_6.jpg', lore:'It laughs. It always laughs. You will laugh too, eventually.',                         col:'#33aacc', glow:'rgba(0,150,180,0.7)',  glowDim:'rgba(0,150,180,0.15)',  filter:'contrast(1.5) brightness(0.5) saturate(1.8) hue-rotate(180deg)' },
      { label:'THE FINAL NIGHT', ghost:'THE DROWNED',   img:'images/ghost_level_7.jpg', lore:'She never left the water. But somehow — she is here.',                                col:'#5577dd', glow:'rgba(40,80,180,0.7)',  glowDim:'rgba(40,80,180,0.15)',  filter:'contrast(1.9) brightness(0.35) saturate(1.2) hue-rotate(200deg)' },
    ];

    function loadProgress() {
      try {
        const raw = localStorage.getItem('dreadlight_progress');
        if (raw) {
          const p = JSON.parse(raw);
          if (p && typeof p === 'object' && typeof p.highestUnlocked === 'number' && Array.isArray(p.completed)) {
            return p;
          }
        }
      } catch(e) {}
      return { highestUnlocked: 1, completed: [] };
    }

    function navigateOut(url) {
      document.body.style.transition = 'opacity 0.7s ease';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = url; }, 750);
    }

    const params   = new URLSearchParams(window.location.search);
    const nightIdx = Math.max(0, Math.min(6, (parseInt(params.get('n')) || 1) - 1));
    const data     = NIGHTS_DATA[nightIdx];
    const progress = loadProgress();

    // set page title
    document.title = 'DREADLIGHT — ' + data.label;

    // night label
    const label = document.getElementById('npNightLabel');
    label.textContent = data.label;
    label.style.color = data.col;
    label.style.textShadow = `0 0 50px ${data.glow}, 4px 4px 0 #0a0202`;

    // portrait
    const portrait = document.getElementById('npPortrait');
    portrait.src = data.img;
    portrait.style.filter = data.filter;
    portrait.style.borderColor = data.col;
    portrait.style.boxShadow = `0 0 45px ${data.glow}, 0 0 90px ${data.glowDim}, inset 0 0 25px rgba(0,0,0,0.85)`;
    portrait.onerror = function() { this.onerror = null; this.src = 'images/jumpscare.jpg'; };

    document.getElementById('npRing1').style.borderColor = data.col;
    document.getElementById('npRing2').style.borderColor = data.col;

    // ghost name
    const nameEl = document.getElementById('npGhostName');
    nameEl.textContent = data.ghost;
    nameEl.style.color = data.col;
    nameEl.style.textShadow = `0 0 30px ${data.glow}, 3px 3px 0 #050000`;

    document.getElementById('npLore').textContent = data.lore;

    // --- build level tiles ---
    const levelOffset = nightIdx * 8;
    const levelsWrap  = document.getElementById('npLevels');

    for (let i = 0; i < 8; i++) {
      const lvl      = levelOffset + i + 1;
      const unlocked = lvl <= progress.highestUnlocked;
      const done     = progress.completed.indexOf(lvl) !== -1;

      const tile = document.createElement('div');
      tile.className = 'np-tile' + (unlocked ? '' : ' locked') + (done ? ' done' : '');
      tile.textContent = lvl;

      if (unlocked) {
        tile.addEventListener('click', () => {
          localStorage.setItem('dreadlight_autostart', String(lvl));
          navigateOut('index.html?v=4');
        });
      }

      levelsWrap.appendChild(tile);
    }

    document.getElementById('npBack').addEventListener('click', () => navigateOut('index.html?v=4'));
  </script>
</body>
</html>
