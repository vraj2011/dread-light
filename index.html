<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DREADLIGHT</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- background effects -->
  <div id="blood-strip"></div>
  <div id="scene"></div>
  <div id="vignette"></div>
  <canvas id="darkness"></canvas>

  <div id="hud">
    <div id="scoreVal">LVL 1</div>
    <div class="lives-label">Lives</div>
    <div class="lives-container" id="livesContainer">❤️❤️</div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="title-block">
      <!-- small detail to set the mood -->
      <div class="warn-stamp">⚠ don't play alone</div>
      <span class="main-title">DREADLIGHT</span>
      <span class="tagline">something is in the dark</span>
    </div>
    <div class="divider"></div>
    <div id="level-grid"></div>
  </div>

  <div id="ghost-caught">
    <img id="caught-ghost-img" src="" alt="">
    <div id="caught-name">???</div>
    <div id="caught-msg">it found you</div>
    <div id="caught-countdown">back in 3...</div>
  </div>

  <!-- intermission screen (super scuffed right now but it works) -->
  <div class="overlay" id="intermissionScreen" style="display:none;">
    <h1>you made it</h1>
    <p id="intermissionText">level 1 done. they're still out there.</p>
    <div class="actions">
      <button class="btn ok" id="nextLevelBtn">keep going</button>
      <button class="btn" id="quitBtn">quit</button>
    </div>
  </div>

  <div class="overlay" id="gameOver" style="display:none;">
    <h1>GAME OVER</h1>
    <div class="final-score"><span id="finalScore">reached level 1</span></div>
    <p>you never had a chance.</p>
    <button class="btn" id="restartBtn">try again</button>
  </div>

  <div id="jumpscare"></div>

  <div class="made-tag">dreadlight // hand-coded</div>

  <script src="game.js"></script>
</body>

</html>
